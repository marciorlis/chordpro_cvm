<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seleção de Hinos</title>
<style>
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  margin: 1rem;
  font-size: 1.3rem;
  line-height: 1.5;
}
a {
  font-size: 1.2rem;
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
}
input {
  font-size: 1.1rem;
  padding: 0.4rem;
  margin: 0.2rem 0;
}
button {
  font-size: 1.1rem;
  padding: 0.5rem 1rem;
  margin-top: 1rem;
}
#lista, #selecionados {
  margin-top: 1rem;
}
@media (max-width: 600px) {
  body {
    margin: 0.8rem;
    font-size: 1.15rem;
  }
}
</style>
</head>
<body>

<h1>Seleção de Hinos</h1>

<p><b>Semana ISO:</b> <span id="semana"></span></p>

<p>
<label>Data:</label><br>
<input type="date" id="data">
</p>

<p>
<label>Descrição:</label><br>
<input type="text" id="descricao" placeholder="Ex.: CVM">
</p>

<p><b>Nome do arquivo:</b></p>
<p id="nomeArquivo"></p>

<hr>

<p>
Pesquisar:<br>
<input type="text" id="busca" placeholder="Digite para pesquisar...">
</p>

<div id="lista">
<p><i>Aqui será carregado automaticamente o hinos.json.</i></p>
</div>

<hr>

<h2>Hinos Selecionados</h2>

<ol id="selecionados"></ol>

<button>Gerar JSON</button>
<button>Copiar JSON</button>
<button>Limpar seleção</button>

<script>
// Próxima etapa:
// - Carregar hinos.json
// - Pesquisa dinâmica
// - Botão +
// - Ordenação ↑ ↓
// - Geração do JSON
// - Download automático
// Nome:
// [ANO] [SEMANA_ISO] [DDMMAAAA] [DESCRIÇÃO].json
//
// Exemplo:
// 2026 023 07062026 CVM.json
</script>

</body>
</html>
