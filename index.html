<!-- FUNÇÃO GLOBAL PARA ABRIR PDF (FUNCIONA EM CELULAR) -->
<script>
function abrirPDF(url) {

  // usa caminho completo da página atual
  const base = window.location.href.replace(/\/[^\/]*$/, '/');
  const urlCompleta = base + url;

  const viewerURL =
    "https://docs.google.com/gview?embedded=true&url=" +
    encodeURIComponent(urlCompleta);

  document.getElementById('pdfFrame').src = viewerURL;

  document.getElementById('viewer').scrollIntoView({
    behavior: 'smooth'
  });
}
</script>

<!-- LISTA PROXDOMX -->
<script>
document.addEventListener('DOMContentLoaded', () => {

fetch('pdf/proxdomx.json')
.then(res => res.json())
.then(lista => {

  lista.sort((a, b) =>
    a.nome.localeCompare(b.nome, 'pt-BR', { sensitivity: 'base' })
  );

  const container = document.getElementById('lista-proxdomx');

  lista.forEach(item => {
    const p = document.createElement('p');

    const a = document.createElement('a');
    a.href = 'pdf/' + item.arquivo;
    a.textContent = item.nome;

    a.onclick = function(e) {
      e.preventDefault();
      abrirPDF(this.getAttribute('href'));
    };

    p.appendChild(a);
    container.appendChild(p);
  });
});
});
</script>

<!-- LISTA PROXDOM -->
<script>
document.addEventListener('DOMContentLoaded', () => {

fetch('pdf/proxdom.json')
.then(res => res.json())
.then(dados => {

  const container = document.getElementById('lista-proxdom');

  // cria título com data (corrige problema de fuso horário)
  const titulo = document.createElement('h3');

  const [ano, mes, dia] = dados.data.split('-');
  const dataLocal = new Date(ano, mes - 1, dia);
  const dataFormatada = dataLocal.toLocaleDateString('pt-BR');

  titulo.textContent = `${dados.titulo} ${dataFormatada}`;
  container.appendChild(titulo);

  const lista = dados.hinos;

  function separarNumero(valor) {
    const match = valor.match(/^([^\d]+)\s*(\d+)/i);
    return {
      prefixo: match ? match[1].trim() : '',
      numero: match ? parseInt(match[2]) : 0
    };
  }

  lista.sort((a, b) => {
    const A = separarNumero(a.numero);
    const B = separarNumero(b.numero);

    const compPrefixo = A.prefixo.localeCompare(B.prefixo, 'pt-BR', {
      sensitivity: 'base'
    });

    if (compPrefixo !== 0) return compPrefixo;
    return A.numero - B.numero;
  });

  lista.forEach(item => {
    const p = document.createElement('p');

    const a = document.createElement('a');
    a.href = 'pdf/' + item.arquivo;
    a.textContent = `${item.nome} — ${item.numero}`;

    a.onclick = function(e) {
      e.preventDefault();
      abrirPDF(this.getAttribute('href'));
    };

    p.appendChild(a);
    container.appendChild(p);
  });

});
});
</script>

<!-- LISTA PROXDOMz -->
<script>
document.addEventListener('DOMContentLoaded', () => {

fetch('pdf/proxdomz.json')
.then(res => res.json())
.then(dados => {

  const container = document.getElementById('lista-proxdom');

  // 1. Cria o título com o nome da seleção e a data formatada
  const titulo = document.createElement('h3');

  let dataFormatada = "";
  if (dados.data) {
    const [ano, mes, dia] = dados.data.split('-');
    const dataLocal = new Date(ano, mes - 1, dia);
    dataFormatada = dataLocal.toLocaleDateString('pt-BR');
  }

  // Exibe o título (se houver) e a data
  const textoTitulo = dados.titulo ? `${dados.titulo} — ${dataFormatada}` : `Hinos do Domingo — ${dataFormatada}`;
  titulo.textContent = textoTitulo;
  container.appendChild(titulo);

  // 2. Renderiza a lista de hinos na ordem em que foram gravados no JSON
  const lista = dados.hinos || [];

  lista.forEach(item => {
    const p = document.createElement('p');

    const a = document.createElement('a');
    a.href = 'pdf/' + item.arquivo;
    
    // Exibe o nome formatado e o número do hino
    a.textContent = `${item.nome}`;

    a.onclick = function(e) {
      e.preventDefault();
      abrirPDF(this.getAttribute('href'));
    };

    p.appendChild(a);
    container.appendChild(p);
  });

})
.catch(erro => console.error('Erro ao carregar o JSON do domingo:', erro));
});
</script>
